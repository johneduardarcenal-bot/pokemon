<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Lonely Bone</title>
    <style>
        body { margin: 0; background-color: #000; color: white; font-family: 'Courier New', Courier, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; background-color: #1a0033; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        
        /* Debug Console */
        #debug-log { position: absolute; top: 0; left: 0; width: 100%; background: rgba(255,0,0,0.7); font-size: 10px; z-index: 999; pointer-events: none; }

        /* Game Boy Dialogue Box */
        #ui-layer { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 90%; display: none; z-index: 100; }
        .dialogue-box { background-color: #fff; border: 4px solid #555; border-radius: 12px; padding: 15px; color: #000; font-size: 16px; font-weight: bold; min-height: 50px; box-shadow: 0 4px 0 #000; line-height: 1.4; }
        .done-typing::after { content: "▼"; display: inline-block; margin-left: 10px; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Mobile Controls */
        #dpad { position: absolute; bottom: 20px; left: 20px; width: 140px; height: 140px; display: none; z-index: 80; }
        .dpad-btn { position: absolute; width: 45px; height: 45px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.6); border-radius: 10px; color: white; display: flex; justify-content: center; align-items: center; font-size: 24px; touch-action: none; }
        #btn-up { top: 0; left: 47px; } #btn-down { bottom: 0; left: 47px; } #btn-left { top: 47px; left: 0; } #btn-right { top: 47px; right: 0; }

        /* TCG Phase */
        #tcg-screen { display: none; position: absolute; inset: 0; background: radial-gradient(circle, #4a148c 0%, #120024 100%); z-index: 200; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 1s; }
        #pack-wrapper { position: relative; width: 240px; height: 340px; display: none; cursor: pointer; animation: float 3s ease-in-out infinite; z-index: 210; }
        .pack-half { position: absolute; width: 100%; height: 50%; background-image: url('The Booster Pack (Closed).jpg'); background-size: 100% 200%; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s; }
        .pack-top { top: 0; background-position: top; } .pack-bottom { bottom: 0; background-position: bottom; }
        .ripped .pack-top { transform: translateY(-300px) rotate(-20deg); opacity: 0; } .ripped .pack-bottom { transform: translateY(300px) rotate(20deg); opacity: 0; }
        #filler-card { display: none; width: 280px; height: 400px; background-image: url('TCG Common Uncommon Filler Cards_Vertical Aspect Ratio.png'); background-size: 200% 200%; border-radius: 15px; box-shadow: 0 0 40px rgba(255,255,255,0.2); z-index: 220; }
        .card-appear { animation: cardPop 0.5s cubic-bezier(0.17, 0.88, 0.32, 1.2) forwards; }
        .card-disappear { animation: cardFade 0.3s ease-in forwards; }
        #reward-card { display: none; height: 400px; border-radius: 15px; animation: float 3s ease-in-out infinite, glow 2s alternate infinite; z-index: 215; }
        #flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 300; transition: opacity 1s; }

        @keyframes cardPop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes cardFade { to { transform: scale(1.1); opacity: 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        @keyframes glow { from { filter: drop-shadow(0 0 5px gold); } to { filter: drop-shadow(0 0 30px gold); } }
    </style>
</head>
<body>
    <div id="debug-log"></div>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="dpad">
            <div class="dpad-btn" id="btn-up">▲</div>
            <div class="dpad-btn" id="btn-left">◀</div>
            <div class="dpad-btn" id="btn-right">▶</div>
            <div class="dpad-btn" id="btn-down">▼</div>
        </div>
        <div id="ui-layer"><div class="dialogue-box" id="text-box"></div></div>
        <div id="tcg-screen">
            <canvas id="p-canvas" style="position:absolute; inset:0; pointer-events:none;"></canvas>
            <h2 id="tcg-title" style="margin-bottom: 20px;"></h2>
            <img id="banner" src="Mobile UI Completion Banner_Sleek Gacha Design.png" style="width:80%; max-width:400px; display:none;">
            <div id="pack-wrapper"><div class="pack-half pack-top"></div><div class="pack-half pack-bottom"></div></div>
            <div id="filler-card"></div>
            <img id="reward-card" src="Cubone Lovers Card.jpg">
        </div>
        <div id="flash"></div>
    </div>

    <script>
        const log = (m) => { document.getElementById('debug-log').innerHTML += m + " | "; console.log(m); };
        window.onerror = (m, s, l) => log("Line " + l + ": " + m);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let state = 'START', scene = 'VILLAGE', scale = 1, tick = 0, fillerIdx = 0;
        let questState = 'TALK_TO_OLD_MAN', playerHistory = [];

        const load = (src) => { 
            const i = new Image(); 
            i.onerror = () => log("MISSING: " + src);
            i.onload = () => console.log("Loaded: " + src);
            i.src = src; return i; 
        };

        const assets = {
            player: { x: 0, y: 0, fX: 0, fY: 0, w: 90, h: 110, img: load('main character.png') },
            oldMan: { x: 0, y: 0, fX: 0, img: load('old man npc.png') },
            cubone1: { x: 0, y: 0, img: load('cubone weeping.png') },
            cubone2: { x: 0, y: 0, fX: 0, fY: 0, img: load('cubone scared and walking.png') },
            bgVillage: load('Background.png'),
            bgGrave: load('graveyard background.png')
        };

        // Widened Safe Center Path
        const obstacles = {
            VILLAGE: [{x:0, y:0, w:0.2, h:0.4}, {x:0.8, y:0, w:0.2, h:0.4}, {x:0.38, y:0.42, w:0.24, h:0.18}, {x:0, y:0.9, w:1, h:0.1}],
            GRAVEYARD: [{x:0, y:0, w:0.2, h:1}, {x:0.8, y:0, w:0.2, h:1}, {x:0.3, y:0, w:0.4, h:0.1}]
        };

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let bg = (scene === 'VILLAGE') ? assets.bgVillage : assets.bgGrave;
            scale = (bg.complete && bg.width > 0) ? Math.max(canvas.width / bg.width, canvas.height / bg.height) : 1.5;
            
            if (state === 'START') {
                assets.player.x = canvas.width / 2 - 45; assets.player.y = canvas.height * 0.75;
                assets.oldMan.x = canvas.width * 0.25; assets.oldMan.y = canvas.height * 0.5;
                assets.cubone1.x = canvas.width * 0.8; assets.cubone1.y = canvas.height * 0.6;
            }
        }
        window.onresize = resize;
        assets.bgVillage.onload = assets.bgGrave.onload = resize;

        const keys = {};
        const start = () => { if(state === 'START') { state = 'PLAY'; if(navigator.maxTouchPoints > 0) document.getElementById('dpad').style.display='block'; resize(); } };
        window.ontouchstart = window.onmousedown = start;
        window.onkeydown = (e) => { start(); keys[e.key.toLowerCase()] = true; };
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        const setupBtn = (id, k) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); keys[k] = true; };
            el.ontouchend = (e) => { e.preventDefault(); keys[k] = false; };
        };
        setupBtn('btn-up','w'); setupBtn('btn-down','s'); setupBtn('btn-left','a'); setupBtn('btn-right','d');

        function checkCollision(nx, ny) {
            let list = (scene === 'VILLAGE') ? obstacles.VILLAGE : obstacles.GRAVEYARD;
            let pw = assets.player.w * scale, ph = assets.player.h * scale;
            if (nx < 0 || nx + pw > canvas.width || ny < 0 || ny + ph > canvas.height) return true;
            for (let o of list) {
                if (nx + pw * 0.5 > o.x * canvas.width && nx + pw * 0.5 < (o.x + o.w) * canvas.width &&
                    ny + ph > o.y * canvas.height && ny + ph * 0.8 < (o.y + o.h) * canvas.height) return true;
            }
            return false;
        }

        function type(text, cb) {
            state = 'TALK'; document.getElementById('ui-layer').style.display = 'block';
            const el = document.getElementById('text-box');
            let i = 0; el.innerHTML = "";
            const interval = setInterval(() => {
                el.innerHTML += text[i]; i++;
                if (i >= text.length) {
                    clearInterval(interval);
                    setTimeout(() => { document.getElementById('ui-layer').style.display='none'; state='PLAY'; if(cb) cb(); }, 2500);
                }
            }, 40);
        }

        function update() {
            if (state !== 'PLAY') return;
            tick++; let mv = 5 * scale, nx = assets.player.x, ny = assets.player.y, moving = false;
            
            if (keys.w) { ny -= mv; assets.player.fY = 1; moving = true; }
            if (keys.s) { ny += mv; assets.player.fY = 0; moving = true; }
            if (keys.a) { nx -= mv; assets.player.fY = 3; moving = true; }
            if (keys.d) { nx += mv; assets.player.fY = 2; moving = true; }

            if (moving && !checkCollision(nx, ny)) { 
                assets.player.x = nx; assets.player.y = ny; 
                playerHistory.push({x: nx, y: ny});
                if (playerHistory.length > 30) playerHistory.shift();
            }
            
            if (moving && tick % 6 === 0) assets.player.fX = (assets.player.fX + 1) % 10;
            if (!moving) assets.player.fX = 0;
            if (tick % 12 === 0) assets.oldMan.fX = (assets.oldMan.fX + 1) % 4;
            if (tick % 8 === 0) assets.cubone2.fX = (assets.cubone2.fX + 1) % 4;

            const dist = (o1, o2) => Math.hypot(o1.x - o2.x, o1.y - o2.y);
            
            if (scene === 'VILLAGE') {
                if (dist(assets.player, assets.oldMan) < 80) {
                    if (questState === 'TALK_TO_OLD_MAN') {
                        type("Old Man: My Cubone is crying... its companion is lost in the Grave! Please find them.", () => {
                            questState = 'FIND_CUBONE'; scene = 'GRAVEYARD';
                            assets.player.x = canvas.width/2 - 45; assets.player.y = canvas.height - 180;
                        });
                    } else if (questState === 'REPORT_TO_OLD_MAN') {
                        type("Old Man: You found the companion! Let them reunite near the fountain.", () => { questState = 'FINALE'; });
                    }
                }
                if (dist(assets.player, assets.cubone1) < 80 && questState === 'FINALE') {
                    type("The Cubones are happy! Take this reward...", () => { triggerTCG(); });
                }
            } else if (scene === 'GRAVEYARD' && dist(assets.player, assets.cubone2) < 80 && questState === 'FIND_CUBONE') {
                type("The Cubone decides to follow you home!", () => {
                    questState = 'REPORT_TO_OLD_MAN'; scene = 'VILLAGE';
                    assets.player.x = canvas.width/2 - 45; assets.player.y = canvas.height * 0.45; playerHistory = [];
                });
            }
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const bg = (scene === 'VILLAGE') ? assets.bgVillage : assets.bgGrave;
            if (bg.complete) {
                let s = Math.max(canvas.width / bg.width, canvas.height / bg.height);
                ctx.drawImage(bg, 0, 0, bg.width * s, bg.height * s);
            } else {
                ctx.fillStyle = "#1a0033"; ctx.fillRect(0,0,canvas.width,canvas.height);
            }

            if (state === 'START') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 24px Courier';
                ctx.fillText("THE LONELY BONE", canvas.width/2, canvas.height/2);
                ctx.font = '16px Courier'; ctx.fillText("Tap to Start", canvas.width/2, canvas.height/2 + 50);
            } else {
                const dr = (a, xc, yc, row, cw, ch) => {
                    if (!a.img.complete) return;
                    let sw = a.img.width/xc, sh = a.img.height/yc;
                    ctx.drawImage(a.img, (a.fX||0)*sw, row*sh, sw, sh, Math.floor(a.x), Math.floor(a.y), (cw||80)*scale, (ch||100)*scale);
                };
                if (questState === 'REPORT_TO_OLD_MAN' || questState === 'FINALE') {
                    if (playerHistory.length > 20) { assets.cubone2.x = playerHistory[0].x; assets.cubone2.y = playerHistory[0].y; dr(assets.cubone2, 4, 2, 1, 70, 70); }
                }
                dr(assets.player, 10, 4, assets.player.fY, 100, 130);
                if (scene === 'VILLAGE') {
                    dr(assets.oldMan, 4, 1, 0, 90, 110);
                    if (assets.cubone1.img.complete) ctx.drawImage(assets.cubone1.img, assets.cubone1.x, assets.cubone1.y, 70*scale, 70*scale);
                } else if (scene === 'GRAVEYARD' && questState === 'FIND_CUBONE') {
                    let sw = assets.cubone2.img.width/4, sh = assets.cubone2.img.height/2;
                    assets.cubone2.x = canvas.width/2 - 35; assets.cubone2.y = canvas.height*0.4;
                    ctx.drawImage(assets.cubone2.img, assets.cubone2.fX*sw, sh, sw, sh, assets.cubone2.x, assets.cubone2.y, 70*scale, 70*scale);
                }
            }
            requestAnimationFrame(draw);
        }

        function triggerTCG() {
            state = 'TCG'; document.getElementById('flash').style.opacity = '1';
            setTimeout(() => {
                document.getElementById('tcg-screen').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('tcg-screen').style.opacity = '1'; document.getElementById('flash').style.opacity = '0';
                    document.getElementById('banner').style.display = 'block';
                    setTimeout(() => { document.getElementById('banner').style.display = 'none'; document.getElementById('pack-wrapper').style.display = 'block'; }, 2000);
                }, 100);
            }, 1000);
        }

        document.getElementById('pack-wrapper').onclick = function() {
            this.classList.add('ripped');
            setTimeout(() => { this.style.display = 'none'; document.getElementById('filler-card').style.display = 'block'; document.getElementById('filler-card').classList.add('card-appear'); }, 800);
        };

        document.getElementById('filler-card').onclick = function() {
            this.classList.add('card-disappear');
            setTimeout(() => {
                fillerIdx++;
                if (fillerIdx < 2) { this.style.backgroundPosition = '100% 0%'; this.classList.remove('card-disappear'); }
                else { this.style.display = 'none'; document.getElementById('reward-card').style.display = 'block'; triggerConfetti(); }
            }, 300);
        };

        function triggerConfetti() {
            const pc = document.getElementById('p-canvas'); const pctx = pc.getContext('2d');
            pc.width = window.innerWidth; pc.height = window.innerHeight;
            let parts = Array.from({length:80}, () => ({ x:pc.width/2, y:pc.height/2, vx:Math.random()*12-6, vy:Math.random()*12-6, l:1 }));
            function anim() { pctx.clearRect(0,0,pc.width,pc.height); parts.forEach(p => { if(p.l>0){ p.x+=p.vx; p.y+=p.vy; p.l-=0.015; pctx.fillStyle=`rgba(255,215,0,${p.l})`; pctx.fillRect(p.x,p.y,5,5); }}); requestAnimationFrame(anim); }
            anim();
        }

        setInterval(update, 1000/60); resize();
    </script>
</body>
</html>
